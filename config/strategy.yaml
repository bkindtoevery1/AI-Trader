strategy:
  name: buy-dip-sell-peak
  symbols:
    - "SOXL"
    - "SOXS"
  interval: "1d"
  candle_count: 200
  short_window: 5
  long_window: 20
  rsi_period: 14
  rsi_buy_below: 62
  rsi_sell_above: 72
  variants:
    - name: bdsp-pro1
      type: dip_sell_peak
      pro: Pro1
    - name: bdsp-pro2
      type: dip_sell_peak
      pro: Pro2
    - name: bdsp-pro3
      type: dip_sell_peak
      pro: Pro3

risk:
  initial_cash: "10000"
  currency: "USD"
  max_position_pct: "0.80"
  symbol_position_caps:
    SOXS: "0.20"
  reserve_cash_pct: "0.10"
  max_order_value: "5000"
  max_daily_orders: 2
  fee_bps: "1.5"
  slippage_bps: "5"
  allow_live_trading: false

execution:
  mode: dry-run
  order_type: LIMIT
  price_offset_bps: "10"

toss:
  base_url: "https://openapi.tossinvest.com"
  client_id_env: "TOSSINVEST_CLIENT_ID"
  client_secret_env: "TOSSINVEST_CLIENT_SECRET"
  account_seq_env: "TOSSINVEST_ACCOUNT_SEQ"
  account_no_env: "TOSSINVEST_ACCOUNT_NO"
