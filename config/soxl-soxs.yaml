strategy:
  name: ma-rsi-core
  symbols:
    - "SOXL"
    - "SOXS"
  interval: "1d"
  candle_count: 1200
  short_window: 5
  long_window: 20
  rsi_period: 14
  rsi_buy_below: 62
  rsi_sell_above: 72
  variants:
    - name: ma-rsi-core
      type: ma_rsi
      short_window: 5
      long_window: 20
      rsi_period: 14
      rsi_buy_below: 62
      rsi_sell_above: 72
    - name: sma-trend-fast
      type: sma_crossover
      short_window: 5
      long_window: 20
    - name: sma-trend-slow
      type: sma_crossover
      short_window: 10
      long_window: 40
    - name: rsi-mean-reversion
      type: rsi_mean_reversion
      rsi_period: 14
      rsi_buy_below: 35
      rsi_sell_above: 65
    - name: buy-and-hold
      type: buy_and_hold

risk:
  initial_cash: "10000000"
  currency: "USD"
  max_position_pct: "0.50"
  reserve_cash_pct: "0.10"
  max_order_value: "5000"
  max_daily_orders: 3
  fee_bps: "1.5"
  slippage_bps: "5"
  allow_live_trading: false

execution:
  mode: dry-run
  order_type: LIMIT
  price_offset_bps: "10"

toss:
  base_url: "https://openapi.tossinvest.com"
  client_id_env: "TOSSINVEST_CLIENT_ID"
  client_secret_env: "TOSSINVEST_CLIENT_SECRET"
  account_seq_env: "TOSSINVEST_ACCOUNT_SEQ"
  account_no_env: "TOSSINVEST_ACCOUNT_NO"
