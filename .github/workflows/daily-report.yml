name: Market Strategy Telegram Reports

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Report phase to send
        required: true
        default: open
        type: choice
        options:
          - open
          - close
  schedule:
    - cron: "35 13,14 * * 1-5"
    - cron: "5 17-21 * * 1-5"

jobs:
  open-report:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.phase == 'open') || github.event.schedule == '35 13,14 * * 1-5' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Send market open strategy report
        run: |
          GUARD="--market-window-guard"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GUARD=""
          fi
          ai-trader daily --live-data --account-snapshot --report-dir reports --dashboard web/public/dashboard-data.json --telegram-optional --telegram-phase open $GUARD
        env:
          AI_TRADER_CONFIG: config/strategy.yaml
          TOSSINVEST_CLIENT_ID: ${{ secrets.TOSSINVEST_CLIENT_ID }}
          TOSSINVEST_CLIENT_SECRET: ${{ secrets.TOSSINVEST_CLIENT_SECRET }}
          TOSSINVEST_ACCOUNT_SEQ: ${{ secrets.TOSSINVEST_ACCOUNT_SEQ }}
          TOSSINVEST_ACCOUNT_NO: ${{ secrets.TOSSINVEST_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELC_TELEGRAM_BOT_TOKEN: ${{ secrets.ELC_TELEGRAM_BOT_TOKEN }}
          ELC_TELEGRAM_CHAT_ID: ${{ secrets.ELC_TELEGRAM_CHAT_ID }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-open-ai-trader-report
          path: |
            reports/
            web/public/dashboard-data.json

  close-report:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.phase == 'close') || github.event.schedule == '5 17-21 * * 1-5' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Send market close performance report
        run: |
          GUARD="--market-window-guard"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GUARD=""
          fi
          ai-trader daily --live-data --account-snapshot --include-today --report-dir reports --dashboard web/public/dashboard-data.json --telegram-optional --telegram-phase close $GUARD
        env:
          AI_TRADER_CONFIG: config/strategy.yaml
          TOSSINVEST_CLIENT_ID: ${{ secrets.TOSSINVEST_CLIENT_ID }}
          TOSSINVEST_CLIENT_SECRET: ${{ secrets.TOSSINVEST_CLIENT_SECRET }}
          TOSSINVEST_ACCOUNT_SEQ: ${{ secrets.TOSSINVEST_ACCOUNT_SEQ }}
          TOSSINVEST_ACCOUNT_NO: ${{ secrets.TOSSINVEST_ACCOUNT_NO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELC_TELEGRAM_BOT_TOKEN: ${{ secrets.ELC_TELEGRAM_BOT_TOKEN }}
          ELC_TELEGRAM_CHAT_ID: ${{ secrets.ELC_TELEGRAM_CHAT_ID }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-close-ai-trader-report
          path: |
            reports/
            web/public/dashboard-data.json
